<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>undoomscroll fixture</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 0; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
    .post { height: 220px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 8px; padding: 12px; }
    #inner { height: 80vh; overflow-y: auto; position: sticky; top: 16px; border: 2px dashed #999; padding: 8px; }
  </style>
</head>
<body>
  <div class="layout">
    <main id="feed"></main>
    <aside id="inner"></aside>
  </div>
  <script>
    for (const [id, n] of [["feed", 60], ["inner", 40]]) {
      const root = document.getElementById(id);
      for (let i = 1; i <= n; i++) {
        const div = document.createElement("div");
        div.className = "post";
        div.textContent = `${id} post ${i}`;
        root.append(div);
      }
    }
    // A site hotkey that must not fire while the modal is open.
    window.hotkeys = 0;
    document.addEventListener("keydown", (e) => { if (e.key === "k") window.hotkeys++; });
  </script>
  <script>
    const data = {};
    window.undoomscrollData = data;
    window.browser = {
      storage: {
        local: {
          get: async (key) => (key in data ? { [key]: structuredClone(data[key]) } : {}),
          set: async (items) => Object.assign(data, structuredClone(items)),
        },
        onChanged: { addListener() {} },
      },
    };
  </script>
  <script src="harness.js"></script>
</body>
</html>
